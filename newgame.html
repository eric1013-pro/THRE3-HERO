<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AETHER CHESS 3D — 3x3 Tactical Auto-Battler</title>
  <style>
    :root {
      --glass-bg: rgba(18, 24, 38, 0.58);
      --glass-bg-strong: rgba(14, 19, 32, 0.82);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --accent-cyan: #38bdf8;
      --accent-blue: #6366f1;
      --accent-gold: #fbbf24;
      --accent-red: #f43f5e;
      --accent-green: #34d399;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #090d16 70%, #05070b 100%);
      color: var(--text-main);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Glassmorphism Common Utility */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.22);
      border-radius: 20px;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .glass-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--glass-highlight);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .glass-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.97);
    }

    .glass-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .glass-btn.primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.38), rgba(99, 102, 241, 0.45));
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    .glass-btn.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.55), rgba(99, 102, 241, 0.65));
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    /* Top HUD Bar */
    #top-hud {
      position: absolute;
      top: 18px;
      left: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    #top-hud > * {
      pointer-events: auto;
    }

    .brand-box {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: linear-gradient(90deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stage-pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #bae6fd;
      font-weight: 700;
    }

    /* Center Scoreboard (Bo3) */
    .scoreboard-box {
      padding: 10px 26px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .team-score {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .pips {
      display: flex;
      gap: 6px;
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
    }

    .pip.won-ally {
      background: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan);
      border-color: #fff;
    }

    .pip.won-enemy {
      background: var(--accent-red);
      box-shadow: 0 0 12px var(--accent-red);
      border-color: #fff;
    }

    .round-center {
      text-align: center;
      min-width: 110px;
    }

    .round-label {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .phase-label {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Stage Progress Bar */
    #stage-selector {
      position: absolute;
      top: 86px;
      left: 24px;
      z-index: 10;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .stage-node {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stage-node.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.28);
    }

    .stage-node.cleared {
      border-color: rgba(52, 211, 153, 0.5);
      color: var(--accent-green);
    }

    /* Guide Banner */
    #helper-banner {
      position: absolute;
      top: 86px;
      right: 24px;
      z-index: 10;
      padding: 10px 16px;
      font-size: 12.5px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .deploy-counter {
      font-weight: 800;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.14);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Bottom Floating Dock */
    #bottom-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(1060px, 95vw);
      pointer-events: none;
    }

    #bottom-dock > * {
      pointer-events: auto;
    }

    /* Once-Per-Match Special Skills Bar */
    .special-bar {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .special-bar-header {
      display: flex;
      flex-direction: column;
      min-width: 175px;
    }

    .special-bar-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .special-bar-desc {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .special-cards {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .special-card {
      flex: 1;
      min-width: 145px;
      padding: 9px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
      overflow: hidden;
    }

    .special-card.ready:hover {
      background: rgba(251, 191, 36, 0.16);
      border-color: rgba(251, 191, 36, 0.65);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(251, 191, 36, 0.22);
    }

    .special-card.used {
      opacity: 0.38;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .special-card.not-deployed {
      opacity: 0.45;
      cursor: default;
    }

    .sc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    .sc-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
    }

    .sc-badge.ready {
      background: rgba(251, 191, 36, 0.25);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.5);
    }

    .sc-badge.used {
      background: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
    }

    .sc-skill-name {
      font-size: 11.5px;
      color: #e2e8f0;
      font-weight: 600;
    }

    .sc-skill-sub {
      font-size: 10.5px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Roster & Controls Bar */
    .roster-bar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .roster-list {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow-x: auto;
    }

    .unit-card {
      flex: 1;
      min-width: 115px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .unit-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .unit-card.deployed {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent-cyan);
      box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .uc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .uc-name {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .uc-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .uc-role {
      font-size: 10px;
      color: var(--text-sub);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
    }

    .uc-desc {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .uc-status {
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .battle-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .start-btn {
      padding: 14px 26px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 16px;
      letter-spacing: 0.4px;
    }

    /* 3D Floating Unit Overlay (HP/Mana Bars & Damage Floating Text) */
    #overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .unit-hud {
      position: absolute;
      transform: translate(-50%, -100%);
      width: 78px;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .unit-hud-name {
      font-size: 10.5px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 3px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    .bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      margin-bottom: 2px;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 0.12s ease;
    }

    .hp-fill.enemy {
      background: linear-gradient(90deg, #e11d48, #fb7185);
    }

    .shield-fill {
      height: 100%;
      background: #e2e8f0;
      transition: width 0.12s ease;
    }

    .mp-wrap {
      width: 100%;
      height: 4px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 3px;
      overflow: hidden;
    }

    .mp-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.12s ease;
    }

    .float-text {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 900;
      font-size: 15px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      animation: floatUp 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.75); }
      25% { opacity: 1; transform: translate(-50%, -16px) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -44px) scale(0.95); }
    }

    /* Center Announcement Banner */
    #center-banner {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      z-index: 25;
      padding: 22px 44px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #center-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .banner-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .banner-sub {
      font-size: 14px;
      color: #cbd5e1;
    }

    /* Codex (캐릭터 도감) Modal */
    #codex-modal {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(5, 8, 15, 0.65);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #codex-modal.open {
      display: flex;
    }

    .codex-window {
      width: min(980px, 95vw);
      max-height: 86vh;
      background: var(--glass-bg-strong);
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow: hidden;
    }

    .codex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 14px;
    }

    .codex-body {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 22px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .codex-tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .codex-tab {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .codex-tab.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.2);
    }

    .codex-detail {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .cd-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .cd-title {
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cd-lore {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      line-height: 1.5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 12px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    .stat-val {
      font-size: 16px;
      font-weight: 800;
      margin-top: 3px;
      color: #fff;
    }

    .skill-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skill-box {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .skill-box.ult {
      background: rgba(56, 189, 248, 0.09);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .skill-box.once {
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.45);
    }

    .sb-tag {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
    }

    .sb-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sb-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    @media (max-width: 780px) {
      .codex-body {
        grid-template-columns: 1fr;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      #helper-banner {
        display: none;
      }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="overlay-layer"></div>

  <!-- Top HUD -->
  <header id="top-hud">
    <div class="glass-panel brand-box">
      <div>
        <div class="brand-title">AETHER CHESS 3D</div>
        <div style="font-size:11px; color:var(--text-sub);">3×3 TACTICAL AUTO-BATTLER</div>
      </div>
      <span class="stage-pill" id="stage-title-pill">STAGE 1</span>
    </div>

    <div class="glass-panel scoreboard-box">
      <div class="team-score" style="color:var(--accent-cyan);">
        <span>ALLY</span>
        <div class="pips" id="ally-pips">
          <div class="pip"></div>
          <div class="pip"></div>
        </div>
      </div>

      <div class="round-center">
        <div class="round-label" id="round-text">ROUND 1 · 3판 2선승</div>
        <div class="phase-label" id="phase-text">배치 단계 (PREP)</div>
      </div>

      <div class="team-score" style="color:var(--accent-red);">
        <div class="pips" id="enemy-pips">
          <div class="pip"></div>
          <div class="pip"></div>
        </div>
        <span>ENEMY</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="glass-btn" id="btn-speed">배속: 1x</button>
      <button class="glass-btn" id="btn-camera">시점 전환</button>
      <button class="glass-btn primary" id="btn-codex">캐릭터 도감</button>
    </div>
  </header>

  <!-- Stage Selector -->
  <div class="glass-panel" id="stage-selector"></div>

  <!-- Helper Banner -->
  <div class="glass-panel" id="helper-banner">
    <span>아군 3×3 타일 위에서 캐릭터를 <b>드래그하여 이동/교체</b>하세요</span>
    <span class="deploy-counter" id="deploy-count-text">배치: 3 / 4</span>
  </div>

  <!-- Center Notification Banner -->
  <div class="glass-panel" id="center-banner">
    <div class="banner-title" id="banner-title">ROUND START</div>
    <div class="banner-sub" id="banner-sub">전투가 시작됩니다</div>
  </div>

  <!-- Bottom Floating Dock -->
  <footer id="bottom-dock">
    <!-- Once-per-match Special Ability Bar -->
    <div class="glass-panel special-bar">
      <div class="special-bar-header">
        <div class="special-bar-title">★ 1회 한정 특수 능력 (OVERDRIVE)</div>
        <div class="special-bar-desc">3판 2선승 매치 동안 캐릭터별 단 1회 발동 가능</div>
      </div>
      <div class="special-cards" id="special-cards-container"></div>
    </div>

    <!-- Roster & Battle Start Bar -->
    <div class="glass-panel roster-bar">

    /**************************************************************
     * 2. 사전 코딩된 5개 스테이지 데이터 (적 3x3 배치)
     * row: 0(상단), 1(중앙), 2(하단) / col: 0(전열), 1(중열), 2(후열)
     **************************************************************/

      {
        stage: 1,
        name: 'STAGE 1 · 성채 외곽 정찰대',
        maxAllyUnits: 3,
        statScale: 0.85,

          { id: 'reinhardt', row: 1, col: 0 },

          { id: 'frost', row: 2, col: 2 }

      },
      {

          { id: 'volt', row: 1, col: 0 },

      {

          { id: 'volt', row: 1, col: 0 },

      currentStageIdx: 0,

    /**************************************************************
     * 4. Three.js 3D 씬, 조명, 양 팀 3x3 타일 보드 초기화
     **************************************************************/
    const container = document.getElementById('canvas-container');
    const overlayLayer = document.getElementById('overlay-layer');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090d16, 0.032);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
    const CAMERA_PRESETS = [
      { pos: new THREE.Vector3(0, 12.5, 14.5), look: new THREE.Vector3(0, 0.4, 0) },
      { pos: new THREE.Vector3(0, 16.5, 7.5), look: new THREE.Vector3(0, 0, 0) },
      { pos: new THREE.Vector3(-4.5, 10.2, 13.8), look: new THREE.Vector3(0.5, 0.4, 0) }
    ];
    camera.position.copy(CAMERA_PRESETS[0].pos);
    camera.lookAt(CAMERA_PRESETS[0].look);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 조명 설정
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
    dirLight.position.set(8, 18, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const allyPointLight = new THREE.PointLight(0x38bdf8, 1.2, 16);
    allyPointLight.position.set(-4.5, 4, 0);
    scene.add(allyPointLight);

    const enemyPointLight = new THREE.PointLight(0xf43f5e, 1.2, 16);
    enemyPointLight.position.set(4.5, 4, 0);
    scene.add(enemyPointLight);

    // 바닥 아레나 플랫폼
    const arenaGeo = new THREE.CylinderGeometry(12.5, 13.5, 0.6, 48);
    const arenaMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      roughness: 0.35,
      metalness: 0.6
    });
    const arenaMesh = new THREE.Mesh(arenaGeo, arenaMat);
    arenaMesh.position.y = -0.35;
    arenaMesh.receiveShadow = true;
    scene.add(arenaMesh);

    // 중앙 분리선 네온 바
    const dividerGeo = new THREE.BoxGeometry(0.14, 0.08, 7.6);
    const dividerMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
    const dividerMesh = new THREE.Mesh(dividerGeo, dividerMat);
    dividerMesh.position.set(0, 0.02, 0);
    scene.add(dividerMesh);

    // 3x3 타일 좌표 계산 헬퍼
    // 아군(ALLY): col 0(후열, x=-6.2), col 1(중열, x=-4.2), col 2(전열, x=-2.2)
    // 적군(ENEMY): col 0(전열, x=+2.2), col 1(중열, x=+4.2), col 2(후열, x=+6.2)
    // row 0(상단, z=-2.1), row 1(중앙, z=0), row 2(하단, z=+2.1)
    const TILE_SPACING_X = 2.05;
    const TILE_SPACING_Z = 2.05;

    function getTileWorldPos(team, row, col) {
      const z = (row - 1) * TILE_SPACING_Z;
      let x;
      if (team === 'ALLY') {
        x = -6.3 + col * TILE_SPACING_X;
      } else {
        x = 2.2 + col * TILE_SPACING_X;
      }
      return new THREE.Vector3(x, 0, z);
    }

    const allyTiles = [];
    const enemyTiles = [];
    const tileGroup = new THREE.Group();
    scene.add(tileGroup);

    function createBoardTiles() {
      const tileGeo = new THREE.BoxGeometry(1.78, 0.14, 1.78);
      const frameGeo = new THREE.EdgesGeometry(tileGeo);

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          // 아군 타일
          const posA = getTileWorldPos('ALLY', r, c);
          const matA = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            roughness: 0.25,
            metalness: 0.5,
            emissive: 0x0ea5e9,
            emissiveIntensity: 0.12
          });
          const meshA = new THREE.Mesh(tileGeo, matA);
          meshA.position.copy(posA);
          meshA.receiveShadow = true;
          meshA.userData = { team: 'ALLY', row: r, col: c };

          const edgeMatA = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55 });
          const edgeA = new THREE.LineSegments(frameGeo, edgeMatA);
          meshA.add(edgeA);

          tileGroup.add(meshA);
          allyTiles.push(meshA);

          // 적군 타일
          const posE = getTileWorldPos('ENEMY', r, c);
          const matE = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            roughness: 0.25,
            metalness: 0.5,
            emissive: 0xf43f5e,
            emissiveIntensity: 0.12
          });
          const meshE = new THREE.Mesh(tileGeo, matE);
          meshE.position.copy(posE);
          meshE.receiveShadow = true;
          meshE.userData = { team: 'ENEMY', row: r, col: c };

          const edgeMatE = new THREE.LineBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.55 });
          const edgeE = new THREE.LineSegments(frameGeo, edgeMatE);
          meshE.add(edgeE);

          tileGroup.add(meshE);
          enemyTiles.push(meshE);
        }
      }
    }
    createBoardTiles();

    // 드래그 시 타일 하이라이트 링
    const ringGeo = new THREE.RingGeometry(0.62, 0.78, 32);
    ringGeo.rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
    const hoverRing = new THREE.Mesh(ringGeo, ringMat);
    hoverRing.position.y = 0.09;
    hoverRing.visible = false;
    scene.add(hoverRing);

    /**************************************************************
     * 5. 캐릭터별 3D 모델 생성기 (고유 무기 & 실루엣)
     **************************************************************/
    function buildHeroMesh(heroId, team) {
      const data = CHARACTERS[heroId];
